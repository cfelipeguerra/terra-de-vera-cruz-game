// layout de cada povoação (posições relativas ao centro da casa, em px de arte), guardado em cache
function citySprites(c){
  const ST=S||BG, f=c.f, cap=f!=='neu'?capitalOf(f):null, isCap=!!(cap && cap.id===c.id);
  const sig=[f,c.pop,Object.keys(c.b||{}).sort().join(','),(c.w||[]).join(','),isCap?1:0,ST.year>=1700?1:0].join('|');
  const hit=G.cityCache.get(c.id); if(hit && hit.sig===sig) return hit.list;
  const out=[], smoke=[], neu=f==='neu', eu=!neu && typeOf(f)==='eu', yr=ST.year, rng=mulberry32(c.id*97+7);
  if(eu){
    const big=c.pop>=6 || (yr>=1700 && c.pop>=4);
    if(c.b.forte){ for(const [dx,dy] of [[-27,-20],[27,-20],[-29,22],[29,22]]) out.push([townSpr('baluarte',sprBaluarte),dx,dy]); for(const [dx,dy] of [[-14,-24],[0,-25],[14,-24],[-29,1],[29,1]]) out.push([townSpr('muro',sprMuro),dx,dy]); }
    else if(c.pop<3) for(let i=0;i<34;i++){ const a=i/34*Math.PI*2; if(Math.abs(i-34/4)<3) continue; out.push([townSpr('estaca',sprEstaca), Math.round(Math.cos(a)*31), Math.round(Math.sin(a)*23)+6]); }
    const slots=[[-21,-12],[21,-12],[-26,3],[26,3],[-16,17],[16,17],[-28,18],[28,18],[-5,27],[8,28],[-31,-10],[31,-10],[-19,29],[21,30],[-12,-24],[12,-24]];
    const n=Math.min(slots.length, 3+Math.round(c.pop*1.4));
    for(let i=0;i<n;i++){ const sob = big && i%3!==2; const [dx,dy]=slots[i]; out.push([townSpr((sob?'sob':'casa')+'|'+f+'|'+(i%3), ()=>sob?sprSobrado(f,i):sprCasa(f,i)), dx, dy]); smoke.push([dx+((i%2)?4:-4), dy-(sob?24:17), 'house']); }
    if(c.pop>=2 || c.b.capela) out.push([townSpr('igreja|'+f+'|'+(c.pop>=6?2:1), ()=>sprIgreja(f, c.pop>=6?2:1)), 0, -9]);
    if(isCap && c.pop>=3) out.push([townSpr('camara|'+f, ()=>sprCamara(f)), 0, 18]);
    if(f!=='hol') out.push([townSpr('pelo',sprPelourinho), 0, 6]);
    if(c.b.engenho){ out.push([townSpr('engenho',sprEngenhoR), 30, 18]); smoke.push([32,-12,'chimney']); }
    if(c.b.mercado){ out.push([townSpr('barR',()=>sprBarraca([204,62,52])), -9, 9]); out.push([townSpr('barY',()=>sprBarraca([228,178,54])), 10, 10]); }
    if(c.b.mina) out.push([townSpr('mina',sprMinaR), -30, -10]);
    if(c.b.fazenda) out.push([townSpr('curral',sprCurral), 26, -26]);
    if(c.b.porto){ const wt=T[c.t].nb.find(j=>!T[j].land); if(wt!=null){ const [x0,y0]=hexPx(c.t), [x1,y1]=hexPx(wt), ux=(x1-x0)/PXK, uy=(y1-y0)/PXK; out.push([townSpr('pier',sprPier), Math.round(ux*34), Math.round(uy*34)+6]); out.push([townSpr('barco|'+f,()=>sprBarco(f)), Math.round(ux*46), Math.round(uy*46)+4]); } }
  } else {
    const style = neu ? (VILLAGE_STYLE[c.people]||'maloca') : 'maloca';
    const straw = neu ? [182,152,98] : f==='gua' ? [198,168,106] : [208,176,108];
    if(style==='anel'){ const n=Math.min(12,6+c.pop); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; out.push([townSpr('oca|'+straw.join(), ()=>sprMaloca(straw,16,i)), Math.round(Math.cos(a)*24), Math.round(Math.sin(a)*17)+6]); } out.push([townSpr('reza|neu', ()=>sprCasaReza(straw,false)), 0, 5]); smoke.push([0,-8,'fire']); }
    else if(style==='toldo'){ const n=Math.min(9,3+c.pop); for(let i=0;i<n;i++){ const dx=Math.round((rng()-0.5)*48), dy=Math.round((rng()-0.5)*34)+6; out.push([townSpr('toldo|'+(i%2), ()=>sprToldo(i%2?[152,112,74]:[178,142,98])), dx, dy]); } smoke.push([0,2,'fire']); }
    else if(style==='abrigo'){ const n=Math.min(9,4+c.pop); for(let i=0;i<n;i++) out.push([townSpr('abrigo',sprAbrigo), Math.round((rng()-0.5)*46), Math.round((rng()-0.5)*32)+6]); smoke.push([0,2,'fire']); }
    else { const n=Math.min(8, 3+Math.ceil(c.pop*0.8)), pos=[[-20,-10],[20,-10],[-24,10],[24,10],[0,-20],[0,26],[-14,24],[14,24]];
      for(let i=0;i<n;i++) out.push([townSpr('maloca|'+straw.join()+'|'+(i%2), ()=>sprMaloca(straw, i%2?22:28, i)), pos[i][0], pos[i][1]]);
      if(c.b && c.b.casa) out.push([townSpr('reza|'+f, ()=>sprCasaReza(straw, f==='gua')), 0, -2]);
      if(c.b && c.b.roca) out.push([townSpr('jirau',sprJirau), 28, 2]);
      if(c.b && c.b.oficina) out.push([townSpr('jirau',sprJirau), -28, 2]); }
    if(style!=='anel'){ out.push(['fire', 0, 8]); smoke.push([0,-2,'fire']); }
    if(c.b && c.b.palicada){ const R=33, n=40; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; if(Math.abs(i-n/4)<3) continue; out.push([townSpr('estaca',sprEstaca), Math.round(Math.cos(a)*R), Math.round(Math.sin(a)*R*0.72)+6]); } }
  }
  if(!neu) out.push(['flag', -14, -22]);
  (c.w||[]).forEach((k,i)=>{ const pos=[[-30,-24],[30,-22],[0,-30],[-32,26]][i%4]; out.push([wonderSprite(k), pos[0], pos[1]]); });
  out.sort((a,b)=>a[2]-b[2]);
  G.cityCache.set(c.id,{sig,list:out,smoke});
  return out;
}

const AMB = {birds:[], clouds:[], animals:[], t:0};
function sprBird(c,f){ const pb=PB(7,4); if(f){ pb.set(0,1,c); pb.set(1,0,c); pb.set(2,1,c); pb.set(3,2,c); pb.set(4,1,c); pb.set(5,0,c); pb.set(6,1,c); } else { pb.rect(0,2,6,2,c); pb.set(3,3,c); pb.set(1,1,c); pb.set(5,1,c); } return pb.canvas(); }
function sprCapivara(f){ const pb=PB(11,7), c=[130,92,58], d=[96,66,40]; pbShadow(pb,6,6,5,1); pb.rect(1,2,8,4,c); pb.rect(1,4,8,4,d); const hy=f?3:2; pb.rect(8,hy,10,hy+1,c); pb.set(10,hy,[40,30,24]); pb.set(9,hy-1,d); pb.rect(2,5,2,5,d); pb.rect(7,5,7,5,d); return pb.outline(OUT).canvas(); }
function sprCloud(w,h,seed){ const pb=PB(w,h), r=mulberry32(seed), puffs=[]; for(let i=0;i<5;i++) puffs.push([4+r()*(w-8), h*0.45+r()*h*0.25, h*0.28+r()*h*0.25]);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let ins=false, top=false; for(const [cx,cy,rr] of puffs){ const d=(x-cx)**2/(rr*1.7)**2+(y-cy)**2/rr**2; if(d<=1){ ins=true; if(y<cy-rr*0.3) top=true; } } if(ins) pb.set(x,y, y>h*0.62?[214,226,240]:top?[255,255,255]:[240,246,252]); } return pb.canvas(); }
function cloudShadow(cl){ const c=mkCanvas(cl.width,cl.height), x=c.getContext('2d'), src=cl.getContext('2d').getImageData(0,0,cl.width,cl.height).data, im=x.createImageData(cl.width,cl.height);
  for(let i=0;i<src.length;i+=4){ const p=i/4, px=p%cl.width, py=(p/cl.width)|0; if(src[i+3]){ im.data[i]=10; im.data[i+1]=24; im.data[i+2]=40; im.data[i+3]=44; } } x.putImageData(im,0,0); return c; }
function ambientInit(){
  const Wd=G.world, r=mulberry32((S||BG).seed+404);
  AMB.spr = AMB.spr || {gull:[sprBird([248,248,248],0),sprBird([248,248,248],1)], arara:[sprBird([220,48,40],0),sprBird([220,48,40],1)], azul:[sprBird([48,104,210],0),sprBird([48,104,210],1)], garca:[sprBird([250,250,246],0),sprBird([250,250,246],1)], capi:[sprCapivara(0),sprCapivara(1)], clouds:[0,1,2,3].map(i=>{ const c=sprCloud(120+i*20,48+i*6,i*7+1); return {c, sh:cloudShadow(c)}; })};
  AMB.animals=[]; for(let k=0;k<6000 && AMB.animals.length<90;k++){ const x=(r()*Wd.WW)|0, y=(r()*Wd.WH)|0, st=sampleTerrain(x,y); if(st.k!==K_LAND || st.rd<3 || st.rd>16) continue; const b=BIOS[st.b]; if(!['pantanal','cerrado','mata','pampa','chaco'].includes(b)) continue; AMB.animals.push({x, y, ph:r()*6}); }
  AMB.clouds=[]; for(let i=0;i<9;i++) AMB.clouds.push({x:r()*Wd.WW, y:r()*Wd.WH, v:5+r()*5, k:i%4});
  AMB.birds=[];
}
function ambientStep(dt, V){
  const Wd=G.world; if(!Wd || !AMB.spr) return;
  for(const c of AMB.clouds){ c.x+=c.v*dt; if(c.x>Wd.WW+80) c.x=-120; }
  for(let i=AMB.birds.length-1;i>=0;i--){ const b=AMB.birds[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.t+=dt; if(b.t>b.life) AMB.birds.splice(i,1); }
  AMB.t-=dt; if(AMB.t<=0 && AMB.birds.length<3 && V){ AMB.t=5+Math.random()*7;
    const cx=(V.vx+V.cw/2)/V.s, cy=(V.vy+V.ch/2)/V.s, w=V.cw/V.s, h=V.ch/V.s, k=sampleTerrain(cx,cy).k;
    const kind = (k===K_WATER||k===K_DEEP||k===K_BEACH) ? 'gull' : (Math.random()<0.5?'arara':'azul');
    const dir=Math.random()<0.5?1:-1, y0=cy+(Math.random()-0.5)*h*0.6, sp=40+Math.random()*16;
    AMB.birds.push({x:cx-dir*(w/2+20), y:y0, vx:dir*sp, vy:(Math.random()-0.5)*6, t:0, life:(w+40)/sp, kind, n:3+((Math.random()*3)|0), seed:Math.random()*9}); }
}
function ambientGround(ctx, V, tt){ // capivaras e sombras de nuvens (abaixo das unidades)
  if(!AMB.spr || !QUALITY.hi) return; const ST=S||BG, Wd=G.world;
  for(const a of AMB.animals){ if(!inView(a.x,a.y,10)) continue; const ti=tileAtPx(a.x,a.y); if(ti<0 || !ST.explored[ti]) continue; const f=Math.floor(tt*0.8+a.ph)%3===0?1:0; const img=AMB.spr.capi[f]; ctx.drawImage(img, a.x-5, a.y-6); }
  for(const c of AMB.clouds){ const s=AMB.spr.clouds[c.k].sh; if(!inView(c.x+40,c.y+50,60)) continue; ctx.drawImage(s, Math.round(c.x+50), Math.round(c.y+80)); }
}
function ambientSky(ctx, V, tt){ // aves e nuvens (acima de tudo)

const selUnit = () => UI.selU!=null ? S.units.find(u=>u.id===UI.selU) || null : null;

function computeMoves(){ const u=selUnit(); UI.reach=null; UI.atk=null; if(!u || u.f!==S.player || S.over) return; if(u.mv>0){ UI.reach=reachable(u); UI.atk = UT[u.type].civ ? [] : T[u.t].nb.filter(j=>hostileAt(u.f,j)); } }
function onTap(ti){
  if(MP.on && S && S.mp){ mpTap(ti); return; }
  if(!S || S.over || S.queue.length || !$('modal').hidden) { if(S && S.over) { clearSel(); UI.selT=ti; syncAll(); } return; }
  const P=S.player, u=selUnit();
  if(u && u.f===P){
    if(UI.atk && UI.atk.includes(ti)){ if(UI.pend===ti){ doAttack(u,ti); return; } UI.pend=ti; syncAll(); return; }
    if(UI.reach && UI.reach.has(ti) && ti!==u.t){ const p=findPath(u,ti,false); if(p){ u.path=null; stepAlong(u,p); afterAct(u); return; } }
    if(ti!==u.t && T[ti].land && S.explored[ti] && !unitAt(ti) && !(cityAt(ti) && cityAt(ti).f!==P) && u.mv>0){
      const p=findPath(u,ti,false); if(p && p.length){ u.path=p; stepAlong(u,u.path); if(!u.path.length) u.path=null; afterAct(u); return; } }
  }
  const o=unitAt(ti), c=cityAt(ti);
  if(o && o.f===P && (!u || u.id!==o.id)){ selectUnit(o); return; }
  if(c && S.explored[ti]){ if(u && u.id===(o&&o.id) && c.f===P){ selectCity(c.id); return; } if(!o || o.f!==P){ selectCity(c.id); return; } }
  if(o && VIS[ti] && o.f!==P){ clearSel(); UI.selT=ti; syncAll(); return; }
  clearSel(); UI.selT=ti; syncAll();
}

  c.drawImage(TB.fore,0,0);
  TB.raf = TB_RM ? 0 : requestAnimationFrame(tbgFrame);
}

function drawLogoBadge(){
  const cv=$('tlogo'); if(!cv || cv.dataset.done) return; cv.dataset.done=1;
  const W=96, H=72, pb=PB(W,H), cx=48, cy=34, gold=[240,192,64], goldD=[176,120,32], goldL=[255,232,150], teal=[30,96,100], tealD=[20,66,72];
  const LEAF=[[40,110,48],[60,140,60],[24,80,36]];
  for(const [lx,ly,a] of [[22,44,-0.5],[18,34,-0.9],[24,24,-1.4],[74,44,0.5],[78,34,0.9],[72,24,1.4],[34,54,-0.2],[62,54,0.2]]) pb.ell(lx,ly,7,3.6,null,(x,y,u,v)=>{ const rx=u*Math.cos(a)-v*Math.sin(a); return Math.abs(rx)<0.12?LEAF[2]:(v<0?LEAF[1]:LEAF[0]); });
  pb.ell(cx,cy,25,25,null,(x,y,u,v)=>{ const d=Math.sqrt(u*u+v*v); return d>0.9?(v<0?goldL:goldD):d>0.82?gold:((x+y)%4===0?tealD:teal); });
  const star=(len,w,c,cd)=>{ for(let k=0;k<4;k++){ const ax=[0,1,0,-1][k], ay=[-1,0,1,0][k]; for(let s=0;s<len;s++){ const half=Math.max(0,Math.round(w*(1-s/len))); for(let o=-half;o<=half;o++){ const x=cx+ax*s+(ay?o:0), y=cy+ay*s+(ax?o:0); pb.set(x,y, o<0?c:cd); } } } };
  star(33,3,goldL,goldD);
  for(const [ax,ay] of [[1,1],[1,-1],[-1,1],[-1,-1]]) for(let s=0;s<17;s++){ const h=Math.max(0,Math.round(2*(1-s/17))); for(let o=-h;o<=h;o++){ pb.set(cx+ax*s+o, cy+ay*s, gold); } }
  pb.ell(cx,cy,3,3,[200,48,40]);
  const out=pb.outline([58,30,10]).canvas(), g=cv.getContext('2d'); cv.width=W; cv.height=H; g.drawImage(out,0,0);
}

const NART = new Map();
function bannerPaint(pb,f,x0,y0,w,h){
  const P=(x,y,c)=>pb.set(x0+x,y0+y,c), R=(a,b,c,d,col)=>pb.rect(x0+a,y0+b,x0+c,y0+d,col);
  const cut=(x,y)=>{ const tail=3, mid=(w-1)/2; return y>h-1-tail && Math.abs(x-mid) < (y-(h-1-tail))*w/(2*tail)*0.9; };
  const field = {por:[244,240,228], esp:[244,240,228], tup:[138,60,154], pot:[184,138,44], gua:[31,154,146]}[f];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(cut(x,y)) continue; let c=field;
    if(f==='hol') c = y<h/3?[232,120,28]:y<2*h/3?[244,240,228]:[40,72,160];
    P(x,y, x===w-1?shadeC(c,0.8):c); }
  const W2=Math.floor(w/2);
  if(f==='por'){ R(W2-3,2,W2+2,3,[232,184,48]); P(W2-3,1,[232,184,48]); P(W2-1,1,[232,184,48]); P(W2+1,1,[232,184,48]); P(W2,1,[200,40,40]);
    R(W2-4,5,W2+3,12,[192,40,40]); R(W2-3,6,W2+2,12,[40,80,176]); P(W2-4,12,null); for(let y=6;y<=12;y++) for(let x=W2-3;x<=W2+2;x++) if((x+y)%3===0) P(x,y,[248,248,248]);
    R(W2-2,13,W2+1,13,[192,40,40]); P(W2-4,7,[240,200,64]); P(W2+3,7,[240,200,64]); P(W2-4,10,[240,200,64]); P(W2+3,10,[240,200,64]); }
  if(f==='esp'){ for(let y=1;y<h-4;y++){ const t=y/(h-5), a=Math.round(1+t*(w-3)), b=Math.round(w-2-t*(w-3)); for(const x of [a,b]){ P(x,y,[192,40,44]); P(x+((y%3)?1:-1),y,[192,40,44]); } } }
  if(f==='tup'){ for(let x=1;x<w-1;x++){ const y=11+((x>>1)%2?1:-1)+(x%2?0:0); P(x,y,[248,240,232]); P(x,y+3,[248,240,232]); } for(let y=2;y<8;y++) P(W2,y,[248,240,232]); P(W2-1,3,[248,240,232]); P(W2+1,3,[248,240,232]); P(W2-2,4,[248,240,232]); P(W2+2,4,[248,240,232]); }
  if(f==='pot'){ const cx=W2, cy=8; for(let a=0;a<16;a++){ const ang=a/16*6.283, r=a%2?5:4; P(Math.round(cx+Math.cos(ang)*r),Math.round(cy+Math.sin(ang)*r),[250,234,190]); } for(let a=0;a<10;a++){ const ang=a/10*6.283, r=1+a*0.22; P(Math.round(cx+Math.cos(ang)*r),Math.round(cy+Math.sin(ang)*r),[250,234,190]); } }
  if(f==='gua'){ const cx=W2, cy=8; for(let y=-5;y<=5;y++) for(let x=-5;x<=5;x++){ const d=Math.abs(x)+Math.abs(y); if(d===5||d===2||d===0) P(cx+x,cy+y,[244,244,236]); } }
}
function nationArt(f){
  if(NART.has(f)) return NART.get(f);
  const W=40, H=36, pb=PB(W,H), r=mulberry32(f.length*31+f.charCodeAt(0));
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let c; if(y<13) c=y<6?[196,228,244]:[214,238,248]; else if(y<18) c=(x+y)%2?[150,196,140]:[160,204,148]; else c=(x*7+y*3)%11===0?[132,176,96]:((x+y)%2?[176,208,128]:[184,214,136]); pb.set(x,y,c); }
  for(let i=0;i<5;i++){ const bx=Math.floor(r()*W), by=16+Math.floor(r()*5); pb.ell(bx,by,3,2,[84,140,72]); pb.set(bx,by-1,[110,166,90]); }
  pb.rect(5,2,5,33,[106,74,40]); pb.rect(6,2,6,33,[78,54,30]); pb.rect(4,1,7,1,[232,184,48]); pb.rect(5,3,19,3,[106,74,40]);
  bannerPaint(pb,f,6,4,14,21);
  const c=hexRGB(FAC[f].col), eu=typeOf(f)==='eu';
  const fig = f==='hol' ? sprPerson({skin:SKIN_EU, cloth:c, pants:[64,64,80], hair:[104,72,48], hat:'brim', hatC:[40,36,40], gun:1, belt:1, beard:[104,72,48]})
    : eu ? sprPerson({skin:SKIN_EU, cloth:c, pants:[72,72,96], hair:[104,72,48], hat:'morion', spear:1, belt:1, beard:[96,64,40]})
    : sprPerson({skin:SKIN_IN, cloth:c, hair:[32,28,28], bare:1, hat:'band', bandC:c, feather:[232,64,48], feather2:[248,208,64], paint:[200,56,40], neck:1, [f==='gua'?'bow':'spear']:1});
  fig.outline(OUT);
  for(let y=0;y<22;y++) for(let x=0;x<16;x++){ const o=(y*16+x)*4; if(fig.d[o+3]) pb.set(21+x,13+y,[fig.d[o],fig.d[o+1],fig.d[o+2]]); }
  pb.ell(29,35,6,1.2,[96,140,72]);
  const url=pb.canvas().toDataURL(); NART.set(f,url); return url;
}
function modeArt(multi){
  const key='mode'+multi; if(NART.has(key)) return NART.get(key);
  const W=40, H=28, pb=PB(W,H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) pb.set(x,y, y<12?[214,238,248]:((x+y)%2?[176,208,128]:[184,214,136]));
  const put=(spr,ox)=>{ spr.outline(OUT); for(let y=0;y<22;y++) for(let x=0;x<16;x++){ const o=(y*16+x)*4; if(spr.d[o+3]) pb.set(ox+x,5+y,[spr.d[o],spr.d[o+1],spr.d[o+2]]); } };
  if(!multi) put(sprPerson({skin:SKIN_EU, cloth:hexRGB(FAC.por.col), pants:[72,72,96], hair:[104,72,48], hat:'morion', spear:1, belt:1}),12);
  else { put(sprPerson({skin:SKIN_EU, cloth:hexRGB(FAC.esp.col), pants:[72,72,96], hair:[104,72,48], hat:'morion', spear:1}),1); put(sprPerson({skin:SKIN_IN, cloth:hexRGB(FAC.gua.col), hair:[32,28,28], bare:1, hat:'band', bandC:hexRGB(FAC.gua.col), feather:[248,208,64], bow:1}),12); put(sprPerson({skin:SKIN_EU, cloth:hexRGB(FAC.hol.col), pants:[64,64,80], hair:[104,72,48], hat:'brim', hatC:[40,36,40], gun:1}),23); }
  const url=pb.canvas().toDataURL(); NART.set(key,url); return url;
}

    showLeaders(p); return; }
  if(b.dataset.leader){ newGame(b.dataset.fac, Math.floor(Math.random()*1e9), b.dataset.leader); S.diff=TS.diff; closeModal(); hideTitle(); buildWorld(); focusHome(); syncAll(); save(); toast('1500: sua vez'); return; }
  if(b.dataset.ev!=null){ resolveEvent(b.dataset.ev); return; }
  if(b.dataset.dq!=null){ resolveQ(b.dataset.dq); return; }
  if(b.dataset.diff){ TS.diff=b.dataset.diff; try{ localStorage.setItem('tvc-diff',TS.diff); }catch(err){} document.querySelectorAll('[data-diff]').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.diff===TS.diff))); const n=$('diffNote'); if(n) n.textContent=DIFF[TS.diff].d+'.'; if(MP.host && MP.lobby) mpLobbyAll(); return; }
  if(b.dataset.cam){ const k=b.dataset.cam; if(k==='in') zoomBy(1); if(k==='out') zoomBy(-1); return; }
  if(b.dataset.close){ $(b.dataset.close).hidden=true; return; }
  const a=b.dataset.act; if(!a) return;
  if(a==='t-new'){ showNewGame(); return; }
  if(a==='t-sp'){ showNations(); return; }
  if(a==='t-opt'){ showOptions(); return; }
  if(a==='t-cred'){ showCredits(); return; }
  if(a==='mp'){ showMpMenu(); return; }
  if(a==='t-main'){ showStart(); return; }
  if(a==='t-src'){ showSources(); return; }
  if(a==='t-home'){ if(S){ save(); BG=S; } S=null; clearSel(); if(G) updateHover(null); renderHUD(); showStart(); return; }
  if(a==='restart'){ clearSave(); if(S){ S.explored.fill(1); VIS.fill(1); syncAll(); BG=S; } S=null; clearSel(); if(G){ G.labels.forEach(l=>l.el.remove()); G.labels.clear(); updateHover(null); } $('sheet').hidden=true; showStart(); return; }
  if(a==='close'){ closeModal(); return; }
  if(a==='back'){ showNations(); return; }
  if(a==='help'){ showHelp(); return; }
  if(a==='quality'){ QUALITY.hi=!QUALITY.hi; try{ localStorage.setItem('tvc-q', QUALITY.hi?'hi':'lo'); }catch(err){} save(); location.reload(); return; }
  if(!S) return;
  const P=S.player, u=selUnit();
  if(a==='showend'){ showEnd(); return; }
  if(a==='desel'){ clearSel(); syncAll(); return; }
  if(a==='min'){ UI.sheetMin=!UI.sheetMin; renderSheet(); return; }
  if(a==='truce'){ proposeTruce(P,b.dataset.f); closeModal(); syncAll(); save(); showDiplo(); return; }
  if(a==='dip'){ playerDip(b.dataset.k,b.dataset.f); syncAll(); save(); showDiplo(); return; }
  if(a==='dipwar'){ const g=b.dataset.f; showModal(`<h2>Declarar guerra?</h2><p>Romper ${allied(P,g)?'a aliança':'a trégua'} com ${esc(facName(g))} custa 10 de prestígio, piora a opinião deles em 30 e a das outras nações em 8.</p><div class="row"><button class="btn primary" type="button" data-act="dipwarok" data-f="${g}">Declarar guerra</button><button class="btn" type="button" data-act="dipback">Voltar</button></div>`); return; }
  if(a==='dipwarok'){ playerDip('war',b.dataset.f); syncAll(); save(); showDiplo(); return; }
  if(a==='dipback'){ showDiplo(); return; }
  if(a==='imp'){ showEmpire(b.dataset.tab); return; }
  if(a==='research'){ S.fac[P].res=b.dataset.k; syncAll(); save(); showEmpire('tech'); return; }
  if(a==='city'){ selectCity(+b.dataset.c); return; }
  if(a==='build'){ const c=CITY_BY.get(+b.dataset.c); if(c && c.f===P){ c.build=b.dataset.k; syncAll(); save(); } return; }
  if(a==='buy'){ const c=CITY_BY.get(+b.dataset.c); if(c && c.build){ const left=Math.max(0,itemCost(c.build)-c.prod), cost=left*2+10; if(S.fac[P].gold>=cost){ addGold(P,-cost); c.prod=itemCost(c.build); toast('Comprado: fica pronto no próximo turno'); syncAll(); save(); } } return; }
  if(!u || u.f!==P) return;
  if(a==='atk' && UI.pend!=null){ doAttack(u,UI.pend); return; }
  if(a==='unpend'){ UI.pend=null; syncAll(); return; }
  if(a==='found'){ if(!canFound(u)){ const c=foundCity(u); clearSel(); updateVision(); syncAll(); save(); selectCity(c.id); } return; }
  if(a==='neg'){ const c=CITY_BY.get(+b.dataset.c); if(c) negotiate(u,c); afterAct(u); return; }
  if(a==='conv'){ const c=CITY_BY.get(+b.dataset.c); if(c && c.f==='neu'){ const ok=convert(u,c); afterAct(ok?null:u); } return; }
  if(a==='gold'){ searchGold(u); afterAct(u); return; }
  if(a==='fort'){ u.fort=1; u.path=null; clearSel(); syncAll(); save(); nextUnit(); return; }
  if(a==='skip'){ u.done=1; clearSel(); syncAll(); nextUnit(); return; }
  if(a==='unpath'){ u.path=null; syncAll(); save(); return; }
});
document.addEventListener('pointerover', e=>{ const n=e.target.closest && e.target.closest('[data-info]'); if(n) natInfo(n.dataset.info); });
document.addEventListener('focusin', e=>{ const n=e.target.closest && e.target.closest('[data-info]'); if(n) natInfo(n.dataset.info); });
$('bEnd').addEventListener('click',()=>{ if(!S || S.over) return; if(MP.on && S.mp){ mpSend({t:'end'}); return; } endTurn(); });
$('bNext').addEventListener('click',nextUnit);
$('bMenu').addEventListener('click',()=>{ if(S) showMenu(); });
$('bLog').addEventListener('click',()=>{ const d=$('drawer'); d.hidden=!d.hidden; });
$('bDip').addEventListener('click',()=>{ if(S && !S.over) showDiplo(); });
$('bImp').addEventListener('click',()=>{ if(S && !S.over) showEmpire(); });
$('bMap').addEventListener('click',()=>{ if(S) toggleMini(); });

function focusHome(){ if(!G) return; const h=homeTile(S.player); if(h!=null){ camFocus(h); CAM.ctx=CAM.tx; CAM.ctz=CAM.tz; } }

/* =========================================================
   INÍCIO
   ========================================================= */
function start(data){
  const ok=initGfx();
  if(!ok){ document.body.insertAdjacentHTML('beforeend','<div class="fatal"><div class="mcard"><h2>Não foi possível iniciar os gráficos</h2><p>Este navegador não permitiu desenhar o mapa. Tente abrir em um navegador atualizado (Chrome, Safari, Edge ou Firefox).</p></div></div>'); return; }
  if(data && data.state){ loadState(data.state); buildWorld(); focusHome(); syncAll(); if(S.queue.length) showQ(S.queue[0]); return; }
  // cenário de fundo para a tela inicial
  newGame('por', 20260423, 'manuel'); S.explored.fill(1); VIS.fill(1);
  syncAll(); BG=S; S=null; renderHUD();
  CAM.tx=CAM.ctx=36; CAM.tz=CAM.ctz=42; CAM.d=CAM.cd=26; CAM.auto=false;
  showStart();
  try{ const sala=new URLSearchParams(location.search).get('sala'); if(sala) showMpMenu(sala.toUpperCase().slice(0,5)); }catch(e){}
}
if(typeof window!=='undefined' && !window.__HEADLESS__){
  window.claude?.hot?.snapshot?.(()=>({state:S}));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
</script>
